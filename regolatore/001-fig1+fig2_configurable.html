<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orologeria completa – struttura dati JSON</title>
<style>
  :root { --bg:#12161c; --panel:#1b2028; --line:#323a47; --text:#e8e4d8; --muted:#9aa3af; --accent:#d9b45a; --ok:#7fc27a; --bad:#f08a6a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
               background:var(--bg); color:var(--text); font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  #stage { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #panel { position:fixed; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right));
           width:350px; max-height:calc(100% - 20px); overflow:auto; padding:12px 14px;
           background:rgba(27,32,40,.95); border:1px solid var(--line); border-radius:10px; }
  h1 { margin:0 0 6px; font:600 15px/1.3 Georgia,"Times New Roman",serif; }
  h2 { margin:12px 0 4px; font:600 13px/1.3 system-ui,sans-serif; color:var(--accent); }
  p { margin:6px 0; color:var(--muted); }
  #selected { display:block; min-height:2.6em; margin:8px 0 4px; color:var(--accent); }
  label { display:block; margin:5px 0; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .buttons { display:flex; gap:6px; margin:6px 0; }
  button, select { font:inherit; color:var(--text); background:#252c37; border:1px solid var(--line);
                   border-radius:6px; padding:6px 8px; cursor:pointer; }
  button { flex:1; }
  button.on { border-color:var(--accent); color:var(--accent); }
  button:focus-visible, select:focus-visible, tr:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  #status { min-height:5em; color:var(--ok); white-space:pre-line; }
  .bad { color:var(--bad); }
  table { width:100%; margin-top:6px; border-collapse:collapse; }
  th { padding:3px 4px; text-align:left; font-weight:600; color:var(--muted); }
  td { padding:3px 4px; border-top:1px solid var(--line); vertical-align:top; }
  tr { cursor:pointer; }
  tr.sel td { background:#2a3140; color:var(--accent); }
  td:first-child { min-width:2em; font-weight:600; white-space:nowrap; }
  td:nth-child(n+3) { text-align:right; white-space:nowrap; }
  .small { font-size:12px; }
  @media (max-width:640px) {
    #panel { top:auto; bottom:0; left:0; right:0; width:auto; max-height:48%; border-radius:12px 12px 0 0;
             padding-bottom:max(12px,env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="Scena 3D dell'orologeria completa"></canvas>

<div id="panel">
  <h1 id="title"></h1>
  <p>Clicca un ingranaggio (o una riga) per farlo girare. Trascina per orbitare, rotella o pizzica per lo zoom,
     tasto destro o due dita per spostare la vista. Assi: X rosso, Y verde (profondità), Z blu (alto).</p>
  <div id="views" class="buttons"></div>
  <div id="groups"></div>
  <div id="variants"></div>

  <b id="selected">Nessun ingranaggio selezionato</b>
  <label>Velocità dell'ingranaggio scelto: <b id="rpmLabel"></b> giri/min
    <input id="speed" type="range" min="-1.5" max="1.8" step="0.01" value="0.6"></label>
  <div class="buttons"><button id="btnCW">↻ Orario</button><button id="btnCCW">↺ Antiorario</button><button id="btnStop">Ferma</button></div>
  <div id="brakes"></div>

  <div id="inputs"></div>
  <div id="controls"></div>
  <p class="small" id="check"></p>

  <h2>Effetto sul moto</h2>
  <p id="status"></p>
  <label>Tempo della simulazione
    <select id="timeScale"><option value="1">1×</option><option value=".25">0,25×</option><option value=".05">0,05×</option></select></label>

  <table>
    <thead><tr><th></th><th>Ingranaggio</th><th>Denti</th><th>Ø mm</th><th>giri/min</th></tr></thead>
    <tbody id="gearRows"></tbody>
  </table>
  <p class="small" id="note"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/8.20.0/babylon.js"></script>
<script>
/* =====================================================================
   0. STRUTTURA DATI  (tutto ciò che serve per costruire e far girare la macchina)
   ---------------------------------------------------------------------
   Per aggiungere un asse o un ingranaggio basta aggiungere un elemento in "axes" o in "gears".
   Sistema di riferimento del modello: X destra, Y profondità (verso il fondo), Z alto. Millimetri.
   Ovunque un numero è atteso si può scrivere un'espressione tra virgolette (es. "pr_F+4+8"):
     • costanti di "consts" e valori dei cursori di "controls" (per nome)
     • z_ID, m_ID, pr_ID, d_ID  = denti, modulo, raggio primitivo, diametro dell'ingranaggio ID
     • ox_ID, oy_ID, oz_ID      = coordinate dell'origine dell'asse ID (dopo il posizionamento)
     • pi, sin, cos, tan, atan, atan2, sqrt, abs, min, max
   Ogni elemento può avere  variant:{nome:valore}  e viene incluso solo se quella variante è attiva.

   AXES (assi di rotazione)
     id        nome breve (compare nelle espressioni ox_ID...)
     dir       direzione positiva di rotazione [x,y,z]
     ref       direzione di azimut 0 (perpendicolare a dir). L'azimut cresce da ref verso dir × ref
     view      da dove si guarda per dire "orario" (vettore dal centro verso l'osservatore) e viewLabel (testo)
     color     colore
     place     come si trova l'origine dell'asse:
                 {at:[x,y,z]}                         posizione assoluta
                 {coaxial:'ID'}                       stessa origine di un altro asse
                 {offset:{from:'ID', by:[x,y,z]}}     spostamento rispetto a un altro asse
                 {byMesh:'G', dir:[x,y,z]}            a distanza (r1+r2) dall'asse con cui l'ingranaggio G ingrana, nella direzione dir
                 {byApex:'G'}                         nell'apice del cono dell'ingranaggio conico G
     carrier   id dell'asse che porta questo asse (satelliti): l'asse orbita con lui
     rotate    {around:'ID', deg:30}  ruota questo asse e tutti quelli che dipendono da lui (posizionati o portati da lui,
               a catena) attorno alla retta dell'asse ID. deg positivo = orario visto dal "view" di ID, negativo = antiorario.
               Può essere un'espressione (es. 'alpha'). Gli assi dipendenti ruotano con tutti i loro vettori: nulla va riposizionato a mano.
     hold      true = quando nessuno lo muove, resta fermo (ingresso a riposo, peso del cliente…)
     parts     alberi, mozzi, marcatori: {shape:'cylinder'|'box'|'prism', ...} nel sistema locale dell'asse
               (w = coordinata lungo dir, at:[x,y] = posizione nel piano, color:'marker' o '#rrggbb')
     group     gruppo di visibilità (vedi "groups")

   GEARS (ingranaggi, ciascuno su un asse)
     id, label, name, axis
     type      'spur' (cilindrico, w:[w0,w1]) | 'bevel' (conico: apexW, side, plate) | 'cylinder' (r, w:[w0,w1], senza denti)
               | 'worm' (vite senza fine vera: module, q = diametro primitivo/modulo, starts, hand = +1 destra/−1 sinistra, w:[w0,w1])
               | 'wormwheel' (ruota per vite: teeth, module, meshWith = id della vite, face opzionale). Va su un asse perpendicolare alla
                 vite e all'interasse; place:{byMesh:'ruota', dir:[...]} la posiziona a distanza (r_vite + r_ruota), centrata sulla vite.
                 La ruota è generata "dentandola" con la vite stessa: i denti combaciano per costruzione. Rapporto = starts/teeth.
     teeth, module            denti e modulo
     meshWith  id dell'ingranaggio con cui ingrana: questo ha un vano, l'altro un dente al punto di contatto,
               il rapporto di velocità e le distanze tra gli assi si ricavano dalla geometria
     apexW     (conico) coordinata sull'asse dove sta l'apice; side = +1/−1: verso da cui sta l'estremità grande
     plate     (conico) disco posteriore {k, from, to, n}
   ===================================================================== */
const MACHINE = {
  title: 'Orologeria completa – Fig. 1 + Fig. 2',

  // Varianti: interruttori che includono/escludono gli elementi con "variant"
  variants: {
    input: { label: "Ingresso dell'asse c", active: 'spur',
             options: { spur: 'Ruote gemelle R–R′ e asse a', bevel: 'Coppia conica R–R′ con asta lunga e snodo S' } }
  },

  // Cursori: il valore finisce nel parametro con lo stesso id (usabile nelle espressioni)
  controls: [
    { id: 'zR', label: 'Denti di R e R′', variantKey: 'input', step: 1,
      ranges: { spur: { min: 50, max: 100, value: 60 }, bevel: { min: 20, max: 60, value: 30 } } },
    { id: 'mR', label: 'Modulo di R e R′ (mm)', variantKey: 'input', step: 0.1,
      ranges: { spur: { min: 1, max: 3, value: 2 }, bevel: { min: 1, max: 3, value: 2 } } },
    // senza variantKey il cursore vale per tutte le varianti (qui sotto: range con chiave 'all')
    { id: 'alpha', label: "Rotazione della Fig. 2 attorno all'asse 3 (°, orario da davanti)", step: 1,
      ranges: { all: { min: -180, max: 180, value: 0 } } }
  ],

  // Costanti (espressioni valutate al bisogno)
  consts: {
  bExt: 350,
    module: 1, face: 8, gap: 7, faceN: 12,
    drumD: 60, drumLen: 105, drumR: 'drumD/2', k0: 0.7,
    // Fig. 1: piani in profondità (Y) e quote verticali (Z)
    yW0: 6, yW1: 'yW0+face', yA0: 'yW1+drumLen', yA1: 'yA0+face', yD0: 'yA1+gap', yD1: 'yD0+face',
    yApex: 'yD1+10-k0*pr_G',                    // apice della coppia F–G (F sta dietro a D ed E)
    zH0: 'pr_F+4+8', zH1: 'zH0+face', zK0: 'zH1+30', zK1: 'zK0+face', zReg: 'zK1+40',
    // Fig. 2: la coordinata w dell'asse principale è u + shift (la parte più arretrata sta 20 mm fuori dalla cassa)
    shift: 80, uV: 0, uS: 48, uN: 92, uQ: 'uN+faceN+36', uR: 'uQ+44',
    yM0: '-(shift+uN+faceN)', yM1: '-(shift+uN)',   // piano di M (e di N)
    e: 'pr_P+pr_Q',                                // interasse dei satelliti = r(P)+r(Q)
    mOS: 'e*2/(z_O+z_S)',                          // modulo di O ed S: stesso interasse di P–Q
    vlen: 300, hlen: 100, rodLen: 200, jointArm: 40,
    phiB: '-pi/2-0.5', bend: '25*pi/180',
    d1x: '-sin(phiB)', d1z: 'cos(phiB)',           // direzione dell'asse di R′ (variante conica)
    d2x: '-sin(phiB+bend)', d2z: 'cos(phiB+bend)', // direzione dell'asta
    lj: 'pr_R+4+jointArm'                          // distanza dello snodo dall'apice
  },

  axes: [
    // ---------------- Fig. 1: assi 1, 2, 3 (orizzontali, in profondità) ----------------
    { id: 'D', name: 'Asse 1 – tamburo', dir: [0, 1, 0], ref: [1, 0, 0], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#a98a3c', hold: true, place: { at: [0, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 5, w: [-22, 'yA1+4'], n: 24 },
        { shape: 'cylinder', r: 2.5, w: ['yW1+1', 'yA0'], at: ['drumR', 0], n: 16, color: 'marker' },
        { shape: 'cylinder', r: 4, w: ['yW0-.4', 'yW1+.4'], at: ['.55*pr_W', 0], n: 16, color: 'marker' }] },
    { id: 'A', name: 'Asse 1 – ruota A', dir: [0, 1, 0], ref: [1, 0, 0], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#d2ac52', place: { at: [0, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 9, w: ['yA0-1', 'yA1+1'], n: 24 },
        { shape: 'cylinder', r: 4, w: ['yA0-.4', 'yA1+.4'], at: ['.6*pr_A', 0], n: 16, color: 'marker' }] },
    { id: 'b', name: 'Asse del pignone di carica', dir: [0, 1, 0], ref: [1, 0, 0], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#9aa4ae', place: { byMesh: 'b', dir: ['cos(-40*pi/180)', 0, 'sin(-40*pi/180)'] },
      parts: [
        { shape: 'cylinder', r: 3, w: [-22, 'yW1-2'], n: 16 },
        { shape: 'box', w: [-34, -21], half: [4, 4] }] },                       // testa quadra per la chiave
    { id: 'C', name: 'Asse 2', dir: [0, 1, 0], ref: [1, 0, 0], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#b08a45', place: { byMesh: 'C', dir: [1, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 5, w: ['yA0-4', 'yD1+2'], n: 24 },
        { shape: 'cylinder', r: 3.5, w: ['yA0-9', 'yD1+4'], n: 16 },
        { shape: 'cylinder', r: 4, w: ['yD0-.4', 'yD1+.4'], at: ['.6*pr_D', 0], n: 16, color: 'marker' }] },
    { id: 'E', name: 'Asse 3', dir: [0, 1, 0], ref: [1, 0, 0], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#d9782e', hold: true, place: { byMesh: 'E', dir: [1, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 6, w: ['yD1-.6', 'yApex+1.15*k0*pr_G'], n: 24 },
        { shape: 'cylinder', r: 3.5, w: ['-(uN+24+shift)', 'yApex+pr_G'], n: 16 },             // asse 3, esteso fino a M
        { shape: 'cylinder', r: 15, w: ['-(uN-18+shift)', '-(uN-34+shift)'], n: 32 },          // tamburo del freno u
        { shape: 'cylinder', r: 3, w: ['yApex+k0*pr_G-.6', 'yApex+k0*pr_G+.5'], at: ['.5*pr_F', 0], n: 16, color: 'marker' },
        { shape: 'cylinder', r: 1.8, w: ['yM0-.4', 'yM1+.4'], at: [6, 0], n: 12, color: 'marker' },
        { shape: 'box', w: ['-(uN-22+shift)', '-(uN-30+shift)'], at: [0, -12], half: [3, 3], color: 'marker' }] },

    // ---------------- Fig. 1: assi 4, 5, 6 (verticali) ----------------
    { id: 'G', name: 'Asse 4', dir: [0, 0, 1], ref: [1, 0, 0], view: [0, 0, 1], viewLabel: "dall'alto",
      color: '#3f74b8', place: { byApex: 'F' },
      parts: [
        { shape: 'cylinder', r: 4, w: ['pr_F+3', 'zH1+10'], n: 16 },
        { shape: 'cylinder', r: 7, w: ['zH0-6', 'zH1+6'], n: 24 },
        { shape: 'cylinder', r: 4, w: ['zH0-.4', 'zH1+.4'], at: ['.6*pr_H', 0], n: 16, color: 'marker' }] },
    { id: 'J', name: 'Asse 5', dir: [0, 0, 1], ref: [1, 0, 0], view: [0, 0, 1], viewLabel: "dall'alto",
      color: '#5f9a4a', place: { byMesh: 'J', dir: [-1, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 3, w: ['zH0-8', 'zK1+8'], n: 16 },
        { shape: 'cylinder', r: 4, w: ['zK0-.4', 'zK1+.4'], at: ['.6*pr_K', 0], n: 16, color: 'marker' }] },
    { id: 'L', name: 'Asse 6 – regolatore', dir: [0, 0, 1], ref: [1, 0, 0], view: [0, 0, 1], viewLabel: "dall'alto",
      color: '#8f5a9b', place: { byMesh: 'L', dir: [-1, 0, 0] },
      parts: [
        { shape: 'cylinder', r: 3, w: ['zK0-8', 'zReg+22'], n: 16 },
        { shape: 'cylinder', r: 6, w: ['zReg', 'zReg+20'], n: 24 },
        { shape: 'prism', poly: [[0, 'zReg+18'], [-34, 'zReg+64'], [-14, 'zReg+76']], y: [-1, 1], color: '#b98cc4' },   // alette
        { shape: 'prism', poly: [[0, 'zReg+18'], [34, 'zReg+64'], [14, 'zReg+76']], y: [-1, 1], color: '#b98cc4' }] },

    // ---------------- Fig. 2: planetario (asse principale parallelo all'asse 3, sopra di esso) ----------------
    { id: 'N', name: 'Asse principale – N', dir: [0, -1, 0], ref: [0, 0, 1], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#d2ac52', group: 'fig2', place: { byMesh: 'N', dir: [0, 0, 1] },
      rotate: { around: 'E', deg: 'alpha' },        // tutta la Fig. 2 (assi che dipendono da N) ruota attorno all'asse 3
      parts: [
        { shape: 'cylinder', r: 9, w: ['shift+uN-2', 'shift+uN+faceN+2'], at: ['-e', 0], n: 24 },                    // bussola eccentrica
        { shape: 'cylinder', r: 3.5, w: ['shift+uN-.4', 'shift+uN+faceN+.4'], at: ['.8*pr_N', 0], n: 16, color: 'marker' },
        { shape: 'box', w: ['shift+uN+faceN', 'shift+uN+faceN+12'], at: ['e', 0], half: [10, 12], color: '#6b7280' },    // T: contrappeso
        { shape: 'cylinder', r: 3, w: ['shift+uV-34', 'shift+uR+face+20'], n: 20, variant: { input: 'spur' } },      // asse interno di N
        { shape: 'cylinder', r: 3, w: ['shift+uV-34', 'shift+uR+6'], n: 20, variant: { input: 'bevel' } }] },
    { id: 'sat', name: 'Asse dei satelliti P e O', dir: [0, -1, 0], ref: [0, 0, 1], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#9aa4ae', group: 'fig2', carrier: 'N', place: { byMesh: 'P', dir: [0, 0, -1] },
      parts: [
        { shape: 'cylinder', r: 3.5, w: ['shift+uS-10', 'shift+uQ+face+4'], n: 20 },
        { shape: 'cylinder', r: 3.5, w: ['shift+uQ-.4', 'shift+uQ+face+.4'], at: ['.6*pr_P', 0], n: 16, color: 'marker' }] },
    { id: 'c', name: 'Tubo c (Q e R)', dir: [0, -1, 0], ref: [0, 0, 1], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#5f9a4a', group: 'fig2', place: { coaxial: 'N' },
      parts: [
        { shape: 'cylinder', r: 6.5, w: ['shift+uN+faceN+1', 'shift+uR+face+8'], n: 24, variant: { input: 'spur' } },
        { shape: 'cylinder', r: 3.5, w: ['shift+uR-.4', 'shift+uR+face+.4'], at: ['.6*pr_R', 0], n: 16, color: 'marker', variant: { input: 'spur' } },
        { shape: 'cylinder', r: 6.5, w: ['shift+uN+faceN+1', 'shift+uR-2'], n: 24, variant: { input: 'bevel' } },
        { shape: 'cylinder', r: 3.5, w: ['shift+uR-4.4', 'shift+uR-3.6'], at: ['.5*pr_R', 0], n: 12, color: 'marker', variant: { input: 'bevel' } }] },
    
{ id: 'bt', name: 'Tubo b (S e V)', dir: [0, -1, 0], ref: [0, 0, 1], view: [0, -1, 0], viewLabel: 'da davanti',
  color: '#3f74b8', group: 'fig2', place: { coaxial: 'N' },
  parts: [
    { shape: 'cylinder', r: 6.5, w: ['shift+uV+face-2-bExt', 'shift+uN-1'], n: 24 },
    { shape: 'cylinder', r: 3.5, w: ['shift+uS-.4', 'shift+uS+face+.4'], at: ['.6*pr_S', 0], n: 16, color: 'marker' },
    { shape: 'cylinder', r: 3.5, w: ['shift+uV+face+3.6-bExt', 'shift+uV+face+4.4-bExt'], at: ['.5*pr_V', 0], n: 12, color: 'marker' }] },
        

    { id: 'vs', name: 'Albero verticale (V2, V3)', dir: [0, 0, 1], ref: [1, 0, 0], view: [0, 0, 1], viewLabel: "dall'alto",
      color: '#c7864a', group: 'fig2', place: { byApex: 'V' },
      parts: [
        { shape: 'cylinder', r: 4, w: ['pr_V2+3', 'vlen-pr_V3-3'], n: 20 },
        { shape: 'cylinder', r: 3.5, w: ['pr_V2+3.6', 'pr_V2+4.4'], at: ['.5*pr_V2', 0], n: 12, color: 'marker' }] },
        
        
        
{ id: 'hs', name: 'Albero orizzontale (V4 e vite)', dir: [-1, 0, 0], ref: [0, 0, 1], view: [-1, 0, 0],
  viewLabel: "dall'estremità libera, guardando verso la coppia conica",
  color: '#4a9bc7', group: 'fig2', place: { byApex: 'V3' },
  rotate: { around: 'vs', deg: -90 },          // -90 = antiorario visto dall'alto
      parts: [
        { shape: 'cylinder', r: 4, w: ['pr_V4+3', 'hlen'], n: 20 },
        { shape: 'box', w: ['hlen', 'hlen+14'], half: [6, 6] },                                                      // estremità quadrata
        { shape: 'cylinder', r: 3.5, w: ['pr_V4+3.6', 'pr_V4+4.4'], at: ['.5*pr_V4', 0], n: 12, color: 'marker' }] },
        
        

    // ---------------- Fig. 2: ruota della vite senza fine, con asse perpendicolare all'asse hs, centrata sopra la vite ----------------
{ id: 'aw', name: 'Asse della ruota della vite (AR)', dir: [0, 1, 0], ref: [0, 0, 1], view: [0, 1, 0], viewLabel: 'da davanti',
  color: '#c9a45a', group: 'fig2', place: { byMesh: 'WG', dir: [0, 0, 1] },
  parts: [
    { shape: 'cylinder', r: 3, w: [-20, '300'], n: 16 },     // 300 mm
    ] },    

    // ---------------- Fig. 2, variante cilindrica: lungo asse a con estremità quadrate ----------------
    { id: 'a', name: 'Asse a (chiave AR)', dir: [0, -1, 0], ref: [0, 0, 1], view: [0, -1, 0], viewLabel: 'da davanti',
      color: '#2fa39a', group: 'fig2', variant: { input: 'spur' },
      place: { byMesh: 'Rp', dir: ['-sin(110*pi/180)', 0, 'cos(110*pi/180)'] },
      parts: [
        { shape: 'cylinder', r: 4, w: ['shift+uV-46', 'shift+uR+face+46'], n: 20 },
