<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria immagini — Heliostat</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #181818;
    color: #eee;
}
h1 { margin: 0 0 8px; font-size: 25px; }
#counter { color: #aaa; margin-bottom: 20px; font-size: 14px; }

#gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}
.item {
    background: #252525;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.item:hover { transform: scale(1.03); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
.item img {
    display: block;
    width: 100%;
    height: 170px;
    object-fit: contain;
    background: #111;
}
.filename { padding: 9px; font-size: 13px; word-break: break-word; color: #ccc; }

#filter {
    width: 100%;
    max-width: 500px;
    margin-bottom: 20px;
    padding: 10px 12px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 15px;
}

/* Visualizzatore */
#viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.94);
    align-items: center;
    justify-content: center;
    padding: 50px;
}
#viewer.active { display: flex; }

#imageContainer {
    max-width: 95vw;
    max-height: 88vh;
    overflow: auto;
    cursor: grab;
    /* non flex */
}
#imageContainer.dragging { cursor: grabbing; }

#imageWrapper {
    display: inline-block;  /* importante per adattarsi alla dimensione scalata */
    transform-origin: 0 0;
    transition: none;
}
#viewerImage {
    display: block;
    max-width: none;
    max-height: none;
    width: auto;
    height: auto;
}

#close {
    position: fixed;
    top: 15px;
    right: 25px;
    font-size: 40px;
    line-height: 40px;
    color: white;
    cursor: pointer;
    user-select: none;
}
#prev, #next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 35px;
    width: 55px;
    height: 70px;
    cursor: pointer;
    border-radius: 8px;
}
#prev:hover, #next:hover { background: rgba(255,255,255,0.3); }
#prev { left: 15px; }
#next { right: 15px; }

#caption {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ccc;
    font-size: 14px;
    padding: 0 70px;
}

@media (max-width: 600px) {
    body { padding: 10px; }
    #gallery { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
    .item img { height:130px; }
    #viewer { padding: 35px 10px; }
    #prev, #next { width:45px; height:55px; font-size:28px; }
}
</style>
</head>
<body>

<h1>Heliostat — immagini</h1>
<div id="counter"></div>
<input id="filter" type="search" placeholder="Filtra per nome file..." autocomplete="off">
<div id="gallery"></div>

<!-- Visualizzatore -->
<div id="viewer">
    <span id="close">&times;</span>
    <button id="prev">&#10094;</button>
    <div id="imageContainer">
        <div id="imageWrapper">
            <img id="viewerImage" src="" alt="">
        </div>
    </div>
    <button id="next">&#10095;</button>
    <div id="caption"></div>
</div>

<script>
"use strict";

// -------------------- ELENCO IMMAGINI --------------------
const images = [
    "001.jpg","002.jpg","003.jpg",
    "Heliostat Meyerstein 2.jpeg","Heliostat Meyerstein Göttingen.jpeg",
    "Traité_de_cinématique-tav.VI(fig102).JPEG",
    "Traité_de_cinématique-tavVI(fig102)(zoom).png",
    "Traité_de_cinématique-tavVI(fig103)(zoom).png",
    "alidada-declinazione.jpg",
    "annales-fig.1-tav.I.png","annales-fig.5-ann.png","annales-fig.5-moderna.png",
    "annales-fig.5-passaggi.png","annales-fig3-color.png","annales-fig3-org.png",
    "annales-fig4-color.png","annales-fig4-org.png",
    "eliostato-foucault-spiegazione-alidada-orario.png",
    "eliostato-silberman-catania-hires.jpg",
    "errore satellite.jpg",
    "focault - primo tipo - Cours_de_physique_de_l'École - fig 670.jpg",
    "focault - primo tipo - disegno SBAGLIATO.png",
    "focault - primo tipo - disegno ok-ann.png",
    "focault - primo tipo - disegno ok-big.png",
    "focault - primo tipo - disegno ok.png",
    "focault - primo tipo - hires(fig 24 recueil).jpg",
    "focualt-siderostat-alternative-1.jpg","focualt-siderostat-alternative-2.jpg",
    "focuault-multilatitude.jpg",
    "forcella-allineata.png","forcella-disallineata.png","forcella-regolabile.png",
    "foucault-cerchio-alidada.png","foucault-cooke-multilatitude-photo-hires.jpg",
    "foucault-disegno-03.jpg","foucault-foto-02(ottima).png",
    "foucault-foto-hires-cooke.png","foucault-foto-hires.png",
    "foucault-hires-denti.jpg","foucault-hires-denti2.jpg",
    "foucault-maxi-01.jpg","foucault-maxi-02.jpg","foucault-maxi-03.jpg",
    "foucault-maxi-04.jpg","foucault-maxi-05.jpg","foucault-maxi-06-bn.jpg",
    "foucault-maxi-07.jpg","foucault-maxi-08.jpg",
    "foucault-reale-01.jpg",
    "gambey-disegno-hires.png","gambey-tav301.png","gambey-tav302.png",
    "heliostat-fuess.jpeg",
    "regolatore-eichens-hires2.jpg",
    "sideorstato-foucualt-foto-dettaglio-posteriore.jpg",
    "tav13-fig1.png","tav13-fig2,2bis.png","tav13-fig2.png",
    "tav13-fig3.png","tav13-fig3b.png","tav13-fig4.png","tav13-fig6.png",
    "tav13.png","tav13mini.png",
    "tav14+15-foucault-travaux.png","tav14-(solo regolatore)-b-mini.jpg",
    "tav14-(solo regolatore)-b.jpg","tav14-fig1,2,3.png",
    "tav14-fig1-travaux.png","tav14-fig2-travaux.png","tav14-fig3-travaux.png",
    "tav14-foucault-travaux-highres.jpg","tav14-foucault-travaux.png",
    "tav14-highres-6000x5000.jpg",
    "tav15-foucault-travaux.png","tav15-highres-6000x4000.jpg",
    "tav16-fig.1.jpg","tav16-fig.2.jpg","tav16-fig.2old.jpg",
    "tavola 16 (schemi).JPEG","tavola 17.JPEG","tavola 18.JPEG","tavola 19.JPEG",
    "tavola-I-Annales.png"
];

// -------------------- DOM --------------------
const gallery = document.getElementById('gallery');
const counter = document.getElementById('counter');
const filter = document.getElementById('filter');
const viewer = document.getElementById('viewer');
const viewerImage = document.getElementById('viewerImage');
const imageContainer = document.getElementById('imageContainer');
const imageWrapper = document.getElementById('imageWrapper');
const caption = document.getElementById('caption');
const closeBtn = document.getElementById('close');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let visibleImages = [...images];
let currentIndex = 0;
let zoom = 1;
let isDragging = false;
let startX, startY, startScrollLeft, startScrollTop;

// -------------------- FUNZIONI --------------------
function imageURL(name) { return encodeURI(name); }

function renderGallery(list) {
    gallery.innerHTML = '';
    counter.textContent = list.length + (list.length === 1 ? ' immagine' : ' immagini');
    list.forEach(filename => {
        const item = document.createElement('div');
        item.className = 'item';
        const img = document.createElement('img');
        img.src = imageURL(filename);
        img.alt = filename;
        img.loading = 'lazy';
        img.addEventListener('error', () => item.style.display = 'none');
        const nameDiv = document.createElement('div');
        nameDiv.className = 'filename';
        nameDiv.textContent = filename;
        item.appendChild(img);
        item.appendChild(nameDiv);
        item.addEventListener('click', () => {
            const idx = visibleImages.indexOf(filename);
            if (idx !== -1) openViewer(idx);
        });
        gallery.appendChild(item);
    });
}

function openViewer(index) {
    if (!visibleImages.length) return;
    currentIndex = index;
    const filename = visibleImages[currentIndex];
    viewerImage.src = imageURL(filename);
    viewerImage.alt = filename;
    // Reset zoom e scroll
    zoom = 1;
    imageWrapper.style.transform = 'scale(1)';
    imageContainer.scrollLeft = 0;
    imageContainer.scrollTop = 0;
    caption.textContent = (currentIndex + 1) + ' / ' + visibleImages.length + ' — ' + filename;
    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeViewer() {
    viewer.classList.remove('active');
    viewerImage.src = '';
    document.body.style.overflow = '';
}

function prevImage() {
    if (!visibleImages.length) return;
    currentIndex = (currentIndex - 1 + visibleImages.length) % visibleImages.length;
    openViewer(currentIndex);
}

function nextImage() {
    if (!visibleImages.length) return;
    currentIndex = (currentIndex + 1) % visibleImages.length;
    openViewer(currentIndex);
}

// -------------------- EVENTI GALLERIA --------------------
filter.addEventListener('input', () => {
    const text = filter.value.trim().toLowerCase();
    visibleImages = images.filter(f => f.toLowerCase().includes(text));
    renderGallery(visibleImages);
});

// -------------------- EVENTI VIEWER --------------------
closeBtn.addEventListener('click', closeViewer);
prevBtn.addEventListener('click', prevImage);
nextBtn.addEventListener('click', nextImage);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });

// Disabilita drag nativo sull'immagine
viewerImage.addEventListener('dragstart', e => e.preventDefault());

// --- Pan ---
imageContainer.addEventListener('mousedown', e => {
    isDragging = true;
    imageContainer.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    startScrollLeft = imageContainer.scrollLeft;
    startScrollTop = imageContainer.scrollTop;
    e.preventDefault();
});
window.addEventListener('mouseup', () => {
    isDragging = false;
    imageContainer.classList.remove('dragging');
});
window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    imageContainer.scrollLeft = startScrollLeft - (e.clientX - startX);
    imageContainer.scrollTop = startScrollTop - (e.clientY - startY);
});

// --- Zoom con rotellina (centrato sul mouse) ---
imageContainer.addEventListener('wheel', function(e) {
    e.preventDefault();

    const rect = imageContainer.getBoundingClientRect();
    // Coordinate del mouse relative al contenuto (prima dello zoom)
    const mouseX = e.clientX - rect.left + imageContainer.scrollLeft;
    const mouseY = e.clientY - rect.top + imageContainer.scrollTop;

    const oldZoom = zoom;
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    zoom = Math.min(20, Math.max(0.1, zoom * delta));

    // Applica scala al wrapper
    imageWrapper.style.transform = 'scale(' + zoom + ')';

    // Calcola il nuovo scroll per mantenere il punto sotto il mouse
    const ratio = zoom / oldZoom;
    const newScrollLeft = mouseX * ratio - (e.clientX - rect.left);
    const newScrollTop = mouseY * ratio - (e.clientY - rect.top);

    // Aggiorna lo scroll
    imageContainer.scrollLeft = newScrollLeft;
    imageContainer.scrollTop = newScrollTop;
}, { passive: false });

// --- Tastiera ---
document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('active')) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
});

// -------------------- AVVIO --------------------
renderGallery(images);
</script>
</body>
</html>
